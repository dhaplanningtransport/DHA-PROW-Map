<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DHA PROW Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@e>
html, body, #map {
    height: 100%;
    margin: 0;
    padding: 0;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leafletscript>

const map = L.map('map').setView([51.3, 0.6], 10);

const carto = L.tileLayer(
'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
{
    attribution:'© OpenStreetMap © CARTO'
}
).addTo(map);

const satellite = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    attribution:'© Esri'
}
);

fetch('KentPROW20GEOJSON.geojson')
.then(r => r.json())
.then(data => {
    L.geoJSON(data,{
        style:{
            color:'red',
            weight:2
        }
    }).addTo(map);
});

fetch('PROWS20mGEOJSON.geojson')
.then(r => r.json())
.then(data => {
    L.geoJSON(data,{
        style:{
            color:'blue',
            weight:3
        }
    }).addTo(map);
});

L.control.layers(
{
    "Carto Light": carto,
    "Satellite": satellite
}
).addTo(map);

</script>

</body>
</html>
